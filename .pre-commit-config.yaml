default_language_version:
  python: python3.14

files: ^(\.djrm-maintenance\.toml$|\.djrm-upstream-delta\.toml$|\.github/|\.gitattributes$|\.gitignore$|\.pre-commit-config\.yaml$|CHANGELOG\.md$|CONTRIBUTING\.md$|MAINTENANCE\.md$|Makefile$|README\.md$|SPEC\.md$|codecov\.yml$|codespell\.txt$|djrm/_ext/|djrm/_version\.py$|pyproject\.toml$|scripts/apply_django_lts\.py$|scripts/audit_upstream_delta\.py$|scripts/check_coverage\.py$|scripts/check_path_case\.py$|scripts/check_release\.py$|scripts/inspect_dist\.py$|scripts/tag_release\.sh$|scripts/test_external_databases\.py$|tests/djrm_smoke/|tests/e2e/|tox\.ini$|uv\.lock$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.py$

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [--fix, --disable, MD024, MD033, MD041]
        files: ^(CHANGELOG|CONTRIBUTING|MAINTENANCE|README|SPEC)\.md$

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: system
        types: [python]
        files: ^(djrm/_ext/|djrm/_version\.py$|scripts/(apply_django_lts|audit_upstream_delta|check_coverage|check_path_case|check_release|inspect_dist|test_external_databases)\.py$|tests/(djrm_smoke|e2e)/)

      - id: ruff-check
        name: ruff-check
        entry: ruff check
        language: system
        types: [python]
        files: ^(djrm/_ext/|djrm/_version\.py$|scripts/(apply_django_lts|audit_upstream_delta|check_coverage|check_path_case|check_release|inspect_dist|test_external_databases)\.py$|tests/(djrm_smoke|e2e)/)

      - id: ty
        name: ty
        entry: ty check
        language: system
        types: [python]
        pass_filenames: false

      - id: pip-audit
        name: pip-audit
        entry: pip-audit
        language: system
        args: [--skip-editable]
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: bandit
        name: bandit
        entry: bandit
        language: system
        args: [-c, pyproject.toml, -r, -n, "3", --severity-level, high, djrm/_ext, scripts]
        files: ^(djrm/_ext/|scripts/)
        pass_filenames: false

      - id: codespell
        name: codespell
        entry: codespell
        language: system
        files: ^(CHANGELOG|CONTRIBUTING|MAINTENANCE|README|SPEC)\.md$|^scripts/.*\.(py|sh|md)$
