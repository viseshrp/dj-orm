[tox]
requires = tox>=4
env_list = py310, py311, py312, py313, py314

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
runner = uv-venv-lock-runner
passenv =
    DJANGO_SETTINGS_MODULE
    DISPLAY
    OBJC_DISABLE_INITIALIZE_FORK_SAFETY
    PYTHONPATH
setenv =
    PYTHONDONTWRITEBYTECODE = 1
commands =
    python -m pytest tests/djo_smoke
    python tests/runtests.py --settings=test_sqlite -v0 --parallel=1
