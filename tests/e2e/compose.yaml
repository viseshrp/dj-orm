services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: djrm
      POSTGRES_USER: djrm
      POSTGRES_PASSWORD: DjrmE2E_2026
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=djrm --dbname=djrm"]
      interval: 2s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4.10
    environment:
      MYSQL_DATABASE: djrm
      MYSQL_USER: djrm
      MYSQL_PASSWORD: DjrmE2E_2026
      MYSQL_ROOT_PASSWORD: DjrmRootE2E_2026
      MYSQL_ROOT_HOST: "%"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping --host=127.0.0.1 --user=root --password=$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 2s
      timeout: 5s
      retries: 60

  oracle:
    image: gvenzl/oracle-free:23.26.1-slim-faststart
    environment:
      ORACLE_PASSWORD: DjrmRootE2E_2026
      APP_USER: DJRM
      APP_USER_PASSWORD: DjrmE2E_2026
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
      start_interval: 2s

  runner:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - ../..:/workspace:ro
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /workspace/tests:/workspace
      DJRM_POSTGRES_HOST: postgres
      DJRM_POSTGRES_PORT: "5432"
      DJRM_MYSQL_HOST: mysql
      DJRM_MYSQL_PORT: "3306"
      DJRM_ORACLE_NAME: oracle:1521/FREEPDB1
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      oracle:
        condition: service_healthy
