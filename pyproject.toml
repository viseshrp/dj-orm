[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "djrm"
dynamic = ["version"]
description = "Django ORM, migrations, and database backends as a standalone library."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "BSD-3-Clause"
license-files = ["LICENSE", "LICENSE.python", "AUTHORS"]
authors = [
    { name = "Django Software Foundation and contributors" },
    { name = "djrm contributors" },
]
maintainers = [
    { name = "Visesh Prasad", email = "viseshrprasad@gmail.com" },
]
keywords = ["database", "django", "migrations", "orm"]
dependencies = [
    "asgiref>=3.8.1",
    "sqlparse>=0.3.1",
    "tzdata; sys_platform == 'win32'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
images = ["Pillow>=9.1.0"]
mysql = ["mysqlclient>=2.1.1"]
oracle = ["oracledb>=1.3.2"]
postgresql = ["psycopg>=3.1.8"]
postgresql-legacy = ["psycopg2>=2.9.9"]
yaml = ["PyYAML>=5.1"]

[project.scripts]
djrm = "djrm.core.management:execute_from_command_line"

[project.urls]
Homepage = "https://github.com/viseshrp/djrm"
Repository = "https://github.com/viseshrp/djrm"
Documentation = "https://github.com/viseshrp/djrm/blob/main/README.md"
Changelog = "https://github.com/viseshrp/djrm/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/viseshrp/djrm/issues"
CI = "https://github.com/viseshrp/djrm/actions"
"Django upstream" = "https://github.com/django/django"

[dependency-groups]
dev = [
    "bandit[toml]>=1.8.6",
    "codespell>=2.4.1",
    "coverage>=7.10.0",
    "hatch>=1.15.0",
    "pip-audit>=2.9.0",
    "psycopg[binary]>=3.1.8",
    "pre-commit>=4.3.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
    "tomli>=2.0; python_version < '3.11'",
    "twine>=6.1.0",
    "ty>=0.0.1a20",
    "uv",
    "tox>=4.28.0",
    "tox-gh-actions>=3.3.0",
    "tox-uv>=1.28.0",
]

[tool.hatch.version]
path = "djrm/_version.py"

[tool.hatch.build]
include = [
    "djrm/**",
    "AUTHORS",
    "CHANGELOG.md",
    "LICENSE",
    "LICENSE.python",
    "README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["djrm"]

[tool.hatch.build.targets.editable]
packages = ["djrm"]

[tool.hatch.build.targets.sdist]
include = [
    ".djrm-maintenance.toml",
    ".djrm-upstream-delta.toml",
    ".github/**",
    ".gitattributes",
    ".gitignore",
    ".pre-commit-config.yaml",
    "AUTHORS",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "LICENSE.python",
    "LIBRARY_AUDIT.md",
    "MAINTENANCE.md",
    "Makefile",
    "README.md",
    "SPEC.md",
    "codecov.yml",
    "codespell.txt",
    "djrm/**",
    "pyproject.toml",
    "scripts/apply_django_lts.py",
    "scripts/audit_upstream_delta.py",
    "scripts/check_coverage.py",
    "scripts/check_path_case.py",
    "scripts/check_release.py",
    "scripts/inspect_dist.py",
    "scripts/rename_namespace.py",
    "scripts/tag_release.sh",
    "scripts/test_external_databases.py",
    "tests/**",
    "tox.ini",
    "uv.lock",
]

[tool.hatch.envs.default]
path = ".venv"

[tool.uv]
default-groups = "all"

[tool.pytest.ini_options]
testpaths = ["tests/djrm_smoke"]
addopts = "--capture=tee-sys --tb=native -ra"
tmp_path_retention_policy = "failed"
markers = [
    "integration: package integration tests",
    "smoke: installed-package smoke tests",
    "unit: isolated maintenance-tool tests",
]

[tool.coverage.run]
branch = true
source = ["djrm"]

[tool.coverage.report]
fail_under = 63
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.djrm.coverage]
modified_floor = 65
fork_floor = 44
modified_paths = [
    "djrm/__init__.py",
    "djrm/conf/__init__.py",
    "djrm/contrib/postgres/fields/array.py",
    "djrm/contrib/postgres/fields/hstore.py",
    "djrm/contrib/postgres/fields/ranges.py",
    "djrm/contrib/postgres/operations.py",
    "djrm/core/checks/__init__.py",
    "djrm/core/management/__init__.py",
    "djrm/db/backends/base/creation.py",
    "djrm/db/backends/base/operations.py",
    "djrm/db/backends/mysql/features.py",
    "djrm/db/backends/oracle/features.py",
    "djrm/db/backends/sqlite3/creation.py",
    "djrm/db/backends/sqlite3/features.py",
    "djrm/db/models/base.py",
    "djrm/db/models/fields/__init__.py",
    "djrm/db/models/fields/files.py",
    "djrm/db/models/fields/json.py",
    "djrm/db/models/fields/related.py",
    "djrm/db/models/functions/math.py",
    "djrm/db/models/sql/compiler.py",
    "djrm/test/__init__.py",
    "djrm/test/runner.py",
    "djrm/test/signals.py",
    "djrm/test/testcases.py",
    "djrm/test/utils.py",
    "djrm/utils/log.py",
    "djrm/utils/translation/__init__.py",
    "djrm/utils/translation/reloader.py",
    "djrm/utils/translation/template.py",
]
fork_paths = [
    "djrm/_ext/*.py",
    "scripts/apply_django_lts.py",
    "scripts/audit_upstream_delta.py",
    "scripts/check_path_case.py",
    "scripts/check_release.py",
    "scripts/inspect_dist.py",
    "scripts/rename_namespace.py",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/djrm_smoke/*" = ["S101"]
"tests/e2e/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["djrm", "scripts", "tests"]
force-sort-within-sections = true

[tool.ty.src]
include = [
    "djrm/_ext",
    "scripts/apply_django_lts.py",
    "scripts/audit_upstream_delta.py",
    "scripts/check_coverage.py",
    "scripts/check_path_case.py",
    "scripts/check_release.py",
    "scripts/inspect_dist.py",
    "tests/djrm_smoke",
]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.analysis]
allowed-unresolved-imports = ["djrm.urls", "tomllib"]

[tool.ty.rules]
unused-type-ignore-comment = "error"

[tool.codespell]
ignore-words = "codespell.txt"
quiet-level = 3
skip = "*.mo,AUTHORS,tests/*"

[tool.bandit]
targets = ["djrm/_ext", "scripts"]
exclude_dirs = ["tests"]
skips = ["B404", "B603", "B607"]
